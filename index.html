<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6">
<title>المنيو</title>
<style>
  html, body { margin: 0; background: #525659; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; }
  img { width: min(100%, 900px); height: auto; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="pages"></div>
<script>
  // يعرض الصور بالترتيب: 1.jpg ثم 2.jpg ثم 3.jpg ... ويتوقف عند أول رقم غير موجود
  const box = document.getElementById("pages");
  function load(n) {
    const img = new Image();
    img.onload = () => { box.appendChild(img); load(n + 1); };
    img.src = n + ".jpg";
  }
  load(1);
</script>
</body>
</html>
